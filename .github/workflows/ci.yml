name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  php-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
      - name: Lint all PHP files
        run: |
          fail=0
          for f in $(find . -name '*.php' -not -path './vendor/*'); do
            php -l "$f" || fail=1
          done
          exit $fail
